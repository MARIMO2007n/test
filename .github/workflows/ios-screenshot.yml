name: iOS Screenshot

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  screenshot:
    name: iOS Simulator Screenshot
    runs-on: macos-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Xcode バージョン確認
        run: xcodebuild -version

      - name: xcodegen をインストール
        run: brew install xcodegen

      - name: Xcode プロジェクトを生成
        run: xcodegen generate --spec project.yml

      - name: 利用可能なシミュレータを確認
        run: xcrun simctl list devices available | grep iPhone

      - name: シミュレータを起動
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available | grep -E "iPhone" | grep -v "Plus\|Pro\|Max\|Mini" | head -1 | grep -oE '[0-9A-F-]{36}')
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> $GITHUB_ENV
          echo "使用するシミュレータID: $SIMULATOR_ID"
          xcrun simctl boot "$SIMULATOR_ID"
          sleep 8

      - name: iOSシミュレータ向けビルド
        run: |
          xcodebuild \
            -project HelloWorld.xcodeproj \
            -scheme HelloWorld \
            -destination "id=$SIMULATOR_ID" \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: ビルド結果を確認
        run: |
          echo "=== .app ファイルを全検索 ==="
          find ./build -name "*.app" -type d 2>/dev/null | grep -v PlugIns || echo ".app が見つかりません"
          echo "=== build ディレクトリ構造 ==="
          ls -la ./build/Build/Products/ 2>/dev/null || echo "Products ディレクトリなし"

      - name: アプリをインストール
        run: |
          APP_PATH=$(find ./build -name "HelloWorld.app" -type d | grep -v PlugIns | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | grep -v PlugIns | grep -v ".git" | grep -v xcodegen | head -1)
          fi
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          echo "アプリパス: $APP_PATH"
          xcrun simctl install "$SIMULATOR_ID" "$APP_PATH"

      - name: アプリを起動
        run: |
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP_PATH/Info.plist" 2>/dev/null || echo "com.example.HelloWorld")
          echo "Bundle ID: $BUNDLE_ID"
          xcrun simctl launch "$SIMULATOR_ID" "$BUNDLE_ID"
          sleep 5

      - name: スクリーンショットを撮影
        run: |
          xcrun simctl io "$SIMULATOR_ID" screenshot screenshot.png
          echo "スクリーンショット撮影完了"

      - name: スクリーンショットをアップロード
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshot
          path: screenshot.png
          retention-days: 30
